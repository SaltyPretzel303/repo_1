- step: 
    name: repo_1_step
    environment: ec2-instance
    image: python 
    command: 
      - echo "yo from repo_1 commit_1" 

- endpoint: 
    name: main-point 
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.7
    server-command: uvicorn predict:app --host 0.0.0.0 --port 8000
    files: 
      - name: model 
        path: model.h5
- step: 
    name: step_1
    environment: manual-gpu
    image: python 
    command: 
      - echo "step 1 commit 1.1" 
      - echo '{"value":"1.1"}'

- step: 
    name: step_2
    environment: manual-gpu
    image: python 
    command: 
      - echo "step_2 commit 2.2" 
    parameters: 
      - name: main_param
        default: "2.2"

- pipeline: 
    name: commit_pipe
    nodes: 
      - name: node_1
        step: step_1
        type: execution
        # commit: d9036ff99517bcb2007ce3c7eec6b0348b11ec59

      - name: node_2
        step: step_2
        type: execution 
        # commit: 687443b9887154fadaf08d5db5b0ea2a5e4813a1

    edges: 
      - [node_1.metadata.value, node_2.parameter.main_param]

- step: 
    name: param-print
    environment: manual-gpu
    image: python
    command:
      - echo "params " {parameters}
    parameters:
      - name: main_param
        type: string
        default: "twenty zero"


- step: 
    name: input-step
    environment: ec2-instance
    image: python
    command:
      - ls -lR /valohai/inputs
      - cat /valohai/inputs/data/*
    inputs:
      - name: data
        optional: true
